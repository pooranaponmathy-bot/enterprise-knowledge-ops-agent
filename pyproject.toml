[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-ops-agent"
version = "0.1.0"
description = "Enterprise Knowledge Ops Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "scikit-learn>=1.4.2",
  "numpy>=1.26.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["knowledge_ops_agent"]
